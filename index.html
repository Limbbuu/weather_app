<!DOCTYPE html>
<html lang="fi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Säätiedot</title>
  <!-- Bootstrap 5 CSS CDN-->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Font Awesome 6 CDN -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Montserrat', sans-serif;
      background-color: #fff;
      margin: 0;
      padding: 0;
    }
    header, footer {
      background: linear-gradient(90deg, #4facfe, #00f2fe);
      color: #fff;
      text-align: center;
      padding: 20px 0;
    }
    main {
      padding: 40px 15px;
    }
    .weather-container {
      max-width: 600px;
      margin: 0 auto;
    }
    .weather-card {
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
      border: none;
    }
  </style>
</head>
<body>
  <!-- Sivun yläosa -->
  <header>
    <h1><i class="fa-solid fa-cloud-sun"></i> Säätiedot</h1>
  </header>

  <!-- Sivun pääsisältö -->
  <main>
    <div class="weather-container">
      <div id="weather" class="card weather-card">
        <div class="card-body text-center">
          <h5 class="card-title">Nykyiset säätiedot</h5>
          <p class="card-text">Ladataan säätietoja...</p>
        </div>
      </div>
    </div>
  </main>

  <!-- Sivun alatunniste -->
  <footer>
    <p>&copy; 2025 VAMK / BIT</p>
  </footer>

  <!-- Ulkoinen JavaScript-tiedosto -->
  <script src="getweather.js"></script>
  <!-- Bootstrap 5 JS Bundle -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
